<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic JavaScript Interaction</title>
  <style>
    .highlight {
      color: white;
      background-color: teal;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="main-title">Welcome to My Page</h1>
  </header>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">Projects</a></li>
    </ul>
  </nav>

  <main>
    <p id="dynamic-text">This is a paragraph that will change.</p>
    <button id="change-text-btn">Change Text & Style</button>
    <button id="toggle-element-btn">Toggle Extra Info</button>
    <div id="extra-info" style="display: none;">Here is some more content added dynamically!</div>
  </main>

  <footer>
    <small>&copy; 2025 Brian Otieno</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
